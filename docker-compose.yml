services:
  antelacus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antelacus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ANTELACUS_PORT:-3002}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - HOSTNAME=${HOSTNAME:-0.0.0.0}
