# Redirect all HTTP traffic to the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name antelacus.com www.antelacus.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    return 301 https://www.antelacus.com$request_uri;
}

# Redirect the apex domain to the canonical www host over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name antelacus.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://www.antelacus.com$request_uri;
}

# Main HTTPS server for the personal site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.antelacus.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        # Response headers must fit proxy_buffer_size or nginx answers 502. A signed-in admin response carries
        # the Supabase session cookies (several KB) on top of the site's own headers, past the 4k default.
        # The other two are unused with buffering off, but nginx -t requires busy < total buffers - one buffer.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
