# Redirect all HTTP traffic to the canonical HTTPS host.
server {
    listen 80;
    listen [::]:80;
    server_name antelacus.com www.antelacus.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    return 301 https://www.antelacus.com$request_uri;
}

# Redirect the apex domain to the canonical www host over HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name antelacus.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    ssl_certificate /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    return 301 https://www.antelacus.com$request_uri;
}

# Main HTTPS server for the personal site; everything but the name and the upstream is shared with staging.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.antelacus.com;
    set $antelacus_upstream http://127.0.0.1:3002;
    include /etc/nginx/snippets/antelacus-site.conf;
}
