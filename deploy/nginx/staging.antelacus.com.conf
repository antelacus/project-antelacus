# Staging (release-pipeline REQ §5.3): the same nginx as production, through the shared file; Cloudflare
# Access stands in front, and nothing here may be indexed.
server {
    listen 80;
    listen [::]:80;
    server_name staging.antelacus.com;

    include /etc/nginx/snippets/cloudflare-ips.conf;
    deny all;

    return 301 https://staging.antelacus.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.antelacus.com;
    set $antelacus_upstream http://127.0.0.1:3003;
    add_header X-Robots-Tag "noindex, nofollow" always;
    include /etc/nginx/snippets/antelacus-site.conf;
}
