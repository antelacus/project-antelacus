name: Deploy

# 推送到 main 即部署到 VPS。服务器上的检出目录只用于部署，不在那里编辑。
on:
  push:
    branches: [main]
    # 只改文档不重新构建线上站点
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# 本工作流不检出代码、不调用 GitHub API，令牌不需要任何权限
permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to production
        # 钉死到提交 SHA：标签可以被改指向别的代码，SHA 不能
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          # 校验服务器主机密钥，防止连接被劫持到冒名主机
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 15m
          script: |
            # 任何一步失败立即中止：拉取失败时绝不能用旧代码继续构建并报告成功
            set -euo pipefail
            cd /home/deploy/antelacus
            git fetch --prune origin
            git checkout main
            # 只允许快进：服务器上的检出若被改动过，宁可失败也不覆盖
            git merge --ff-only origin/main
            echo "deploying $(git rev-parse --short HEAD)"
            # 构建成功后才替换容器；构建失败时旧容器继续服务
            docker compose up -d --build
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://localhost:3002/; then echo "healthy after $((i*3))s"; exit 0; fi
              sleep 3
            done
            echo "health check failed"; docker compose logs --tail 60; exit 1
